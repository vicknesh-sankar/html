<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Selected Work</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #050505;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }

  :root {
    --lime: #d4ff3f;
    --muted: #7a7a7f;
  }

  .section {
    padding: 100px 0 60px;
    overflow: hidden;
  }

  .head {
    padding: 0 60px;
    margin-bottom: 52px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: capitalize;
    color: var(--lime);
    margin: 0 0 18px;
    font-weight: 600;
  }

  .headline {
    font-size: clamp(34px, 5.5vw, 64px);
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -1.5px;
    margin: 0;
    max-width: 700px;
  }

  .drag-hint {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: capitalize;
    color: var(--muted);
    white-space: nowrap;
  }

  .drag-hint svg { width: 26px; height: 14px; }

  /* Drag rail */
  .rail-wrap {
    padding-left: 60px;
    cursor: grab;
  }
  .rail-wrap.dragging { cursor: grabbing; }

  .rail {
    display: flex;
    gap: 24px;
    overflow-x: auto;
    scrollbar-width: none;
    scroll-snap-type: x proximity;
    padding-bottom: 8px;
  }
  .rail::-webkit-scrollbar { display: none; }

  .card {
    position: relative;
    flex: 0 0 auto;
    width: 380px;
    scroll-snap-align: start;
    user-select: none;
  }

  .card-media {
    position: relative;
    width: 100%;
    height: 460px;
    border-radius: 14px;
    overflow: hidden;
    background: #111;
  }

  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .card-media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.15) 45%, transparent 65%);
  }

  .card-tag {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 2;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: capitalize;
    color: #d8d8dc;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .card-index {
    position: absolute;
    top: 18px;
    right: 20px;
    z-index: 2;
    font-family: "Courier New", monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }

  .card-stat {
    position: absolute;
    left: 20px;
    bottom: 88px;
    z-index: 2;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--lime);
    line-height: 1;
  }

  .card-bottom {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 20px;
    z-index: 2;
  }

  .card-name {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  .card-desc {
    font-size: 13px;
    line-height: 1.5;
    color: #c4c4c8;
    margin: 0 0 16px;
    max-width: 300px;
  }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
  }
  .card-link svg { width: 14px; height: 14px; transition: transform 0.3s ease; }
  .card:hover .card-link svg { transform: translateX(4px); }

  .footer-row {
    padding: 0 60px;
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: "Courier New", monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .footer-track {
    position: relative;
    width: 160px;
    height: 1px;
    background: #232326;
  }
  .footer-track-fill {
    position: absolute;
    left: 0; top: 0;
    height: 1px;
    width: 16.66%;
    background: var(--lime);
    transition: width 0.2s ease;
  }

  @media (max-width: 700px) {
    .head { padding: 0 20px; flex-direction: column; align-items: flex-start; }
    .rail-wrap { padding-left: 20px; }
    .footer-row { padding: 0 20px; }
    .card { width: 300px; }
    .card-media { height: 380px; }
  }
</style>
</head>
<body>

<section class="section">
  <div class="head">
    <div>
      <div class="eyebrow">Selected Work</div>
      <h2 class="headline">Projects that moved the needle.</h2>
    </div>
    <div class="drag-hint">
      <svg viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 7h24M1 7l4-4M1 7l4 4M25 7l-4-4M25 7l-4 4"/></svg>
      drag to explore
    </div>
  </div>

  <div class="rail-wrap" id="railWrap">
    <div class="rail" id="rail">
      <!-- cards injected by JS -->
    </div>
  </div>

  <div class="footer-row">
    <span id="counter">01 / 06</span>
    <div class="footer-track"><div class="footer-track-fill" id="trackFill"></div></div>
  </div>
</section>

<script>
  const projects = [
    { tag: "Social Media · UGC", stat: "+417K", label: "followers", name: "@dr.remina",
      desc: "Featured in Forbes Canada. $100K+ revenue in 90 days.",
      grad: "linear-gradient(135deg, #2b2b1f, #1a1a14)" },
    { tag: "AI SEO · Web Dev", stat: "320%", label: "organic growth", name: "Savants AI",
      desc: "Ranked #1 for 14 AI-related keywords in 6 months.",
      grad: "linear-gradient(135deg, #14201f, #0d1414)" },
    { tag: "Meta Ads · Branding", stat: "5.2×", label: "ROAS", name: "Pongbot",
      desc: "$6.8M revenue attributed to paid social campaigns.",
      grad: "linear-gradient(135deg, #201420, #140d14)" },
    { tag: "Branding · Identity", stat: "0→1", label: "full brand built", name: "Slavista",
      desc: "Logo, mascots, packaging & social launch for Miami's Slavic cuisine brand.",
      grad: "linear-gradient(135deg, #201a14, #140f0d)" },
    { tag: "Non-Profit · Google Grants", stat: "$120K", label: "in free ad spend", name: "Gateway Counseling",
      desc: "Unlocked Google Grant, tripled donor acquisition YoY.",
      grad: "linear-gradient(135deg, #14181f, #0d0f14)" },
    { tag: "Web Design · Awwwwards", stat: "A+", label: "quality redesign", name: "Duck English",
      desc: "Full editorial redesign for a top English school \u2014 micro-animations, bold typography & Awwwwards-grade UX.",
      grad: "linear-gradient(135deg, #1a2018, #10140d)" }
  ];

  const rail = document.getElementById('rail');
  projects.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-media" style="background:${p.grad}">
        <span class="card-tag">${p.tag}</span>
        <span class="card-index">0${i + 1}</span>
        <div class="card-stat">${p.stat}<span style="font-size:14px;font-weight:600;color:#c4c4c8;display:block;margin-top:4px;letter-spacing:0;">${p.label}</span></div>
        <div class="card-bottom">
          <div class="card-name">${p.name}</div>
          <p class="card-desc">${p.desc}</p>
          <a class="card-link" href="#">View project
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </div>`;
    rail.appendChild(card);
  });

  // Drag to scroll
  const railWrap = document.getElementById('railWrap');
  let isDown = false, startX, scrollLeft;

  railWrap.addEventListener('mousedown', (e) => {
    isDown = true;
    railWrap.classList.add('dragging');
    startX = e.pageX;
    scrollLeft = rail.scrollLeft;
  });
  window.addEventListener('mouseup', () => { isDown = false; railWrap.classList.remove('dragging'); });
  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    rail.scrollLeft = scrollLeft - dx;
  });

  // Counter + progress track
  const counter = document.getElementById('counter');
  const trackFill = document.getElementById('trackFill');
  const total = projects.length;

  function updateCounter() {
    const cardWidth = rail.children[0].offsetWidth + 24;
    const idx = Math.min(total - 1, Math.round(rail.scrollLeft / cardWidth));
    counter.textContent = String(idx + 1).padStart(2, '0') + ' / 0' + total;
    trackFill.style.width = ((idx + 1) / total * 100) + '%';
  }
  rail.addEventListener('scroll', updateCounter, { passive: true });
  updateCounter();
</script>
</body>
</html>
